name: Tracker regression tests

on:
  push:
    branches: [main]
    paths:
      - app.js
      - index.html
      - styles.css
      - social-preview.svg
      - tests/**
      - .github/workflows/tests.yml
  pull_request:
    paths:
      - app.js
      - index.html
      - styles.css
      - social-preview.svg
      - tests/**
      - .github/workflows/tests.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run tracker regression tests
        run: node --test tests/tracker.test.cjs
